// Names changed when Minecraft split rendering into extraction in 26.1.
// Keep shared code and transform the renamed identifiers at build time.
[sourceSets.main, sourceSets.smoke].each { sources ->
    def originalDirs = sources.java.srcDirs.toList()
    def prepared = tasks.register('prepare' + sources.name.capitalize() + 'LegacySources', Sync) {
        inputs.file rootProject.file('../compat-1.21.gradle')
        from originalDirs
        into layout.buildDirectory.dir('generated/sources/compat/' + sources.name)
        filteringCharset = 'UTF-8'
        filter { line ->
            if (project.minecraft_version != '1.21.11') {
                line = line.replace('Identifier', 'ResourceLocation')
                    .replace('net.minecraft.client.gui.screens.ChatScreen.class', 'net.minecraft.client.gui.screens.Screen.class')
                    .replace('Style style, boolean insertionMode, CallbackInfoReturnable<Boolean> cir', 'Style style, CallbackInfoReturnable<Boolean> cir')
            }
            line
            .replace('GuiGraphicsExtractor', 'GuiGraphics')
            .replace('extractRenderState', 'render')
            .replace('extractBackground', 'renderBackground')
            .replace('extractTooltipBackground', 'renderTooltipBackground')
            .replace('componentHoverEffect', 'renderComponentHoverEffect')
            .replace('.centeredText(', '.drawCenteredString(')
            .replace('Lnet/minecraft/client/multiplayer/chat/GuiMessageSource;', '')
            .replace('Lnet/minecraft/client/multiplayer/chat/GuiMessageTag;', 'Lnet/minecraft/client/GuiMessageTag;')
        }
    }
    sources.java.setSrcDirs([prepared])
}
