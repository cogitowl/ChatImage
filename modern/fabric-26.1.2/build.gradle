plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
version = "1.4.8-continued.1+${minecraft_version}+fabric"
group = 'io.github.cogitowl'
base { archivesName = 'ChatImage' }
repositories {
    mavenCentral()
    maven { url = 'https://maven.kituin.fun/releases' }
    maven { url = 'https://maven.terraformersmc.com/releases' }
}
sourceSets.main {
    java.srcDirs = ['../common/src/main/java', '../game-26.1/src/main/java', '../fabric/src/main/java']
    resources.srcDirs = ['../common/src/main/resources', '../fabric/src/main/resources']
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    include implementation('io.github.kituin:ChatImageCode:0.12.2')
}
processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    filesMatching('fabric.mod.json') { expand version: project.version, minecraft_version: project.minecraft_version }
}
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25; withSourcesJar() }
jar { from('../LICENSE') }
sourceSets { smoke {
    compileClasspath += sourceSets.main.output + configurations.compileClasspath
    runtimeClasspath += output + compileClasspath + configurations.runtimeClasspath
    java.srcDirs = ['../smoke/src/test/java', '../smoke-common/src/main/java']
    resources.srcDirs = ['../smoke/src/test/resources']
} }
tasks.register('smokeJar', Jar) {
    dependsOn smokeClasses
    archiveBaseName = 'ChatImage-smoke'
    from sourceSets.smoke.output
}
loom.runs {
    smoke {
        client()
        runDir 'run-smoke'
        vmArg "-Dfabric.addMods=${layout.buildDirectory.file('libs/ChatImage-smoke-' + project.version + '.jar').get().asFile}"
    }
}
tasks.named('runSmoke') {
    dependsOn tasks.named('smokeJar')
    doFirst { delete 'run-smoke/smoke-result.txt' }
    doLast {
        def result = file('run-smoke/smoke-result.txt')
        if (!result.exists() || !result.text.startsWith('OK:')) {
            throw new GradleException('ChatImage runtime smoke test failed: ' + (result.exists() ? result.text : 'no result'))
        }
    }
}
