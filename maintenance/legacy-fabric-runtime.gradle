// Fabric mods also run through Quilt's Fabric compatibility layer.
// -Pquilt selects the real Quilt loader for development and smoke tests.
if (project.hasProperty('quilt')) {
    repositories { maven { url = 'https://maven.quiltmc.org/repository/release/' } }
    dependencies {
        runtimeOnly 'org.quiltmc:quilt-loader:0.30.1'
        runtimeOnly 'org.quiltmc:quilt-json5:1.0.4+final'
        runtimeOnly 'org.quiltmc:quilt-config:1.3.3'
        runtimeOnly 'net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7'
        compileOnly 'net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7'
        ['asm','asm-analysis','asm-commons','asm-tree','asm-util'].each {
            runtimeOnly "org.ow2.asm:${it}:9.10.1"
        }
    }
    configurations.runtimeClasspath { exclude group: 'net.fabricmc', module: 'fabric-loader' }
    // Older Fabric API modules pull Loader through Loom's remapped mod classpath.
    // Exclude it before remapping as well, so Quilt supplies the compatibility API.
    configurations.modImplementation { exclude group: 'net.fabricmc', module: 'fabric-loader' }

}
loom.mods { chatimage { sourceSet sourceSets.main } }
sourceSets { smoke {
    compileClasspath += sourceSets.main.output + configurations.compileClasspath
    runtimeClasspath += output + compileClasspath + configurations.runtimeClasspath
    java.srcDirs = ['../../maintenance/smoke-legacy/src/main/java']
    resources.srcDirs = ['../../maintenance/smoke-legacy/src/main/resources']
} }
tasks.register('smokeJar', Jar) {
    dependsOn smokeClasses
    archiveBaseName = 'ChatImage-smoke'
    from sourceSets.smoke.output
}
loom.runs {
    smoke {
        client()
        runDir 'run-smoke'
        def smokePath = layout.buildDirectory.file('libs/ChatImage-smoke-' + project.version + '.jar').get().asFile
        vmArg "-Dfabric.addMods=${smokePath}"
        if (project.hasProperty('quilt')) vmArg "-Dloader.addMods=${smokePath}"
    }
}
tasks.named('runSmoke') {
    dependsOn smokeJar
    doFirst { delete 'run-smoke/smoke-result.txt' }
    doLast {
        def result = file('run-smoke/smoke-result.txt')
        if (!result.exists() || !result.text.startsWith('OK:')) {
            throw new GradleException('ChatImage smoke failed: ' + (result.exists() ? result.text : 'no result'))
        }
    }
}

if (project.hasProperty('quilt')) {
    loom.runs.configureEach {
        mainClass.set(environment == 'client' ? 'org.quiltmc.loader.impl.launch.knot.KnotClient' : 'org.quiltmc.loader.impl.launch.knot.KnotServer')
        vmArg "-Dloader.classPathGroups=${sourceSets.main.output.files.collect { it.absolutePath }.join(File.pathSeparator)}"
        vmArg '-Dloader.development=true'
        vmArg '-Dloader.noGui=true'
        vmArg "-Dloader.remapClasspathFile=${layout.projectDirectory.file('.gradle/loom-cache/remapClasspath.txt').asFile}"
        vmArg '-Dloader.experimental.minecraft.targetNamespace=named'
    }
}
