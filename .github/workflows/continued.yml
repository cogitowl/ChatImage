name: Continued compatibility builds
on:
  push:
    branches: ['continued/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: continued-${{ github.ref }}
  cancel-in-progress: true
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: targets
        run: echo "matrix=$(python3 maintenance/matrix.py)" >> "$GITHUB_OUTPUT"
  build:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    name: ${{ matrix.loader }} ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate legacy sources
        if: ${{ !startsWith(matrix.path, 'modern/') }}
        run: bash init.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: ${{ matrix.path }}
        run: bash gradlew build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ChatImage-${{ matrix.loader }}-${{ matrix.target }}
          path: |
            ChatImage-jar/**/*.jar
            ${{ matrix.path }}/build/libs/*.jar
          if-no-files-found: error
