name: Continued compatibility builds
on:
  push:
    branches: ['continued/**']
  workflow_dispatch:
    inputs:
      smoke:
        description: 'Run graphical smoke tests for modern versions'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: continued-${{ github.ref }}
  cancel-in-progress: true
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: targets
        run: echo "matrix=$(python3 maintenance/matrix.py)" >> "$GITHUB_OUTPUT"
  build:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    name: ${{ matrix.loader }} ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate legacy sources
        if: ${{ !startsWith(matrix.path, 'modern/') }}
        run: bash init.sh
      - uses: actions/setup-java@v4
        if: ${{ matrix.loader == 'forge' && startsWith(matrix.path, 'modern/') }}
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: ${{ matrix.path }}
        env:
          LOADER: ${{ matrix.loader }}
        run: |
          if [ "$LOADER" = quilt ] && [ -f fabric.gradle ]; then
            bash gradlew build -Pquilt --no-daemon --stacktrace
          else
            bash gradlew build --no-daemon --stacktrace
          fi
      - name: Runtime smoke test
        if: ${{ inputs.smoke && startsWith(matrix.path, 'modern/') }}
        working-directory: ${{ matrix.path }}
        env:
          LOADER: ${{ matrix.loader }}
        run: |
          case "$LOADER" in
            fabric|quilt) xvfb-run -a timeout 240 bash gradlew runSmoke --no-daemon ;;
            forge|neoforge) xvfb-run -a timeout 240 bash gradlew runClient -Psmoke --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64 ;;
          esac
      - name: Stage installable jars
        env:
          LOADER: ${{ matrix.loader }}
          TARGET: ${{ matrix.target }}
        run: python3 maintenance/collect_artifacts.py --loader "$LOADER" --target "$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: ChatImage-${{ matrix.loader }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
